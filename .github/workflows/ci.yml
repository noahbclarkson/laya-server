name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  python:
    name: ruff + pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install --index-url https://download.pytorch.org/whl/cpu torch==2.14.0
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: ruff format --check .
      - run: ruff check .
      - run: pytest

  rust:
    name: verify crate fmt + clippy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: verify
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: verify
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings

  docker:
    name: docker end to end
    runs-on: ubuntu-latest
    needs: [python, rust]
    steps:
      - uses: actions/checkout@v7
      - run: docker compose up -d --build
      - name: Wait for the checkpoint to download and load
        run: |
          for _ in $(seq 1 90); do
            health=$(docker inspect -f '{{.State.Health.Status}}' laya-server-laya-1)
            state=$(docker inspect -f '{{.State.Status}}' laya-server-laya-1)
            if [ "$health" = healthy ]; then exit 0; fi
            if [ "$state" != running ]; then break; fi
            sleep 10
          done
          echo "container is $state / $health"
          exit 1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: verify
      - name: typesafe-api against the container
        working-directory: verify
        run: cargo test -- --nocapture
      - if: always()
        run: docker compose logs

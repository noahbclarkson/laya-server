# Tool configuration only; the server is a script, not an installable package.
# Dependencies are in requirements.txt, because PyTorch has to come from a
# hardware-specific index before them.

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[package]
name = "laya-server-verify"
version = "0.0.0"
edition = "2024"
publish = false
description = "End-to-end checks of laya-server through the typesafe-api crate"
license = "MIT OR Apache-2.0"

[dev-dependencies]
typesafe-api = { git = "https://github.com/noahbclarkson/typesafe-api-rs", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
